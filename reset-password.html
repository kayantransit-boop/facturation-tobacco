<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <title>Réinitialisation — TabacPro</title>
  <style>
    body { font-family: sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#f3f4f6; }
    .card { background:white; border-radius:16px; padding:40px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,0.1); max-width:380px; }
    h2 { color:#1a1a2e; margin-bottom:8px; }
    p  { color:#6b7280; font-size:14px; margin-bottom:24px; }
    .btn { background:#1a1a2e; color:white; border:none; padding:13px 28px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; width:100%; }
    .btn:hover { background:#2d2d4e; }
    .success { color:#10b981; font-weight:700; margin-top:16px; display:none; }
  </style>
</head>
<body>
<div class="card">
  <div style="font-size:48px;margin-bottom:12px">🔑</div>
  <h2>Réinitialiser le mot de passe</h2>
  <p>Cliquez sur le bouton ci-dessous pour remettre les identifiants par défaut :<br/><strong>admin / admin123</strong></p>
  <button class="btn" onclick="resetCredentials()">Réinitialiser maintenant</button>
  <div class="success" id="msg">✓ Réinitialisation effectuée ! Redirection vers l'application…</div>
</div>
<script>
function resetCredentials() {
  localStorage.removeItem('tabac_credentials');
  localStorage.removeItem('tabac_session');
  sessionStorage.clear();
  document.getElementById('msg').style.display = 'block';
  setTimeout(() => { window.location.href = 'index.html'; }, 2000);
}
</script>
</body>
</html>
